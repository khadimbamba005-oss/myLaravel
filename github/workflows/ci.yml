name: Laravel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests-applicatifs:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4

      - name: Initialiser PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
            php-version:'8.4'
            extensions: mbstring, xml, ctype,iconv, sqlite3
            tools: composer

      - name: Installer les dependances du projet (Composer)
        run: composer install --no-ansi --no-interaction --no-scripts --prefer-dist


      - name: Preparer l'environnement de travail
        run: cp .env.example .env
      - name: Generer la cle applicative unique
        run: php artisan key:generate

      - name: Executer la suite de tests unitaire et d'integration
        run: php artisan test
